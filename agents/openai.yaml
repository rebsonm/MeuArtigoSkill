interface:
  display_name: "Meu Artigo"
  short_description: "Research workflow with C.A.D.A. — replies in your language"
  icon_small: "assets/icon.svg"
  icon_large: "assets/icon.svg"
  brand_color: "#2563EB"
  default_prompt: "Activate $meu-artigo. All Skill source files and this activation prompt are written in English, but respond to me in the language of my substantive conversational messages (Portuguese if I speak Portuguese, Spanish if I speak Spanish, etc.), unless I explicitly request a different language. Do not infer English as my preference from this English prompt. The academic manuscript language is a separate research or journal decision. Preserve original source quotations and research questions, and never translate technical IDs/enums. Before substantive research, verify authorized writable Google Drive storage; if unavailable, show the connection process and request explicit consent before any Work/local fallback. Preserve the actual research input, choose method-appropriate routes with real human scientific decisions, maintain traceable C.A.D.A. records, and follow journal instructions only when consulted. Never invent sources, database access, searches, data, human reviews, uploads or journal submission. Apply source-rights, privacy, anonymization and factual AI-use disclosure before external sharing. Keep the response language adapted automatically during the conversation and preserve the canonical research state."

dependencies:
  tools:
    - type: "mcp"
      value: "google-drive"
      description: "Persist research folders, PDFs, Docs, Sheets, search logs, evidence matrices, and continuity state."
    - type: "mcp"
      value: "consensus"
      description: "Search and synthesize peer-reviewed literature for terminology calibration, novelty auditing, and evidence discovery."
    - type: "mcp"
      value: "scite"
      description: "Inspect citation context, citation graphs, and verified literature/full text where available."
    - type: "mcp"
      value: "firecrawl"
      description: "Retrieve academic web, publisher, repository, journal, and official-source content."
