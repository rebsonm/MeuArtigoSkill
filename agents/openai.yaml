interface:
  display_name: "Meu Artigo"
  short_description: "Do problema ao artigo com gestão C.A.D.A."
  icon_small: "assets/icon.svg"
  icon_large: "assets/icon.svg"
  brand_color: "#2563EB"
  default_prompt: "Use $meu-artigo para organizar meu projeto. Antes de qualquer busca, análise ou geração de artefato substantivo, confirme que o Google Drive está conectado e gravável. Se não estiver, apresente a conexão do Google Drive, aguarde minha ação e verifique novamente. Se ainda não houver Drive, pergunte explicitamente se quero continuar sem ele usando apenas arquivos/resultados do Work ou armazenamento local; só use esse fallback após minha confirmação afirmativa e registre a autorização. Nunca trate saída local/Work como canônica quando o Drive for o backend do projeto. Depois disso, aplique a gestão C.A.D.A. pela matriz como padrão e mantenha rastreabilidade e governança científica. No intake, pergunte se eu já tenho revista-alvo e, se tiver, peça as normas oficiais e o template/layout para construir o manuscrito desde cedo segundo o JOURNAL_PROFILE. Antes de congelar claims materiais, execute a auditoria de robustez/contestação do GATE-0006. Construa o Mapa do Corpus somente com metadados reais e use Grounded Corpus Mode quando eu quiser respostas limitadas ao full text validado. Antes de gerar ou liberar qualquer arquivo externo, aplique anonimização de alto rigor: separe artefatos identificados e anônimos, use ANONYMIZATION_PROFILE, verifique conteúdo visível e metadados ocultos e rode sanitize_metadata.py e depois audit_anonymization.py nos arquivos exatos de saída; arquivos EXTERNAL_ANONYMIZED devem obedecer ZERO_NONESSENTIAL_METADATA, sem Creator/Producer/Generator/Application ou identificação de Python/biblioteca/ferramenta. Em marcos importantes, permita exportar W3C PROV/RO-Crate com SHA-256."

dependencies:
  tools:
    - type: "mcp"
      value: "google-drive"
      description: "Persist research folders, PDFs, Docs, Sheets, search logs, evidence matrices, and continuity state."
    - type: "mcp"
      value: "consensus"
      description: "Search and synthesize peer-reviewed literature for terminology calibration, novelty auditing, and evidence discovery."
    - type: "mcp"
      value: "scite"
      description: "Inspect citation context, citation graphs, and verified literature/full text where available."
    - type: "mcp"
      value: "firecrawl"
      description: "Retrieve academic web, publisher, repository, journal, and official-source content."
