name: Publish RC.1 (manual)

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: 'Type publish-rc1 to publish experimental RC.1 with the 51 attributed PDFs'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-rc1:
    name: Publish experimental RC.1 prerelease
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout pinned main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Confirm release intent and version
        shell: bash
        env:
          ACK: ${{ inputs.acknowledgement }}
        run: |
          test "$ACK" = "publish-rc1"
          test "$(cat VERSION)" = "1.0.0-rc.1"
          test -f docs/RC1-GITHUB-PRERELEASE-NOTES.md
          test -f knowledge/methodology/PDF-ATTRIBUTIONS.md

      - name: Fail if RC.1 release or tag already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0-rc.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing RC.1 release; refusing to overwrite"
            exit 1
          fi
          if git ls-remote --tags origin refs/tags/v1.0.0-rc.1 | grep -q .; then
            echo "::error::Existing tag; refusing to overwrite"
            exit 1
          fi

      - name: Recheck software, documentation, licences and method gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_audit.py
          python -m unittest discover -s tests -q
          python scripts/check_documentation_links.py
          python scripts/audit_public_docs.py
          python scripts/audit_repository_secrets.py
          python scripts/audit_source_language.py --strict
          python scripts/check_release_metadata.py --candidate
          python scripts/audit_public_pdf_release.py --verify-only

      - name: Build and verify installable Skill ZIP
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_skill_bundle.py
          python scripts/build_skill_bundle.py --verify dist/MeuArtigoSkill-v1.0.0-rc.1.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Archive all 51 public PDFs with separate credits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path(".")
          catalog = json.loads((root / "knowledge/methodology/pdf_catalog.json").read_text())
          docs = catalog["documents"]
          assert len(docs) == 51, "Expected exactly 51 catalogued PDFs"
          listed = set()
          for item in docs:
              relative = Path(item["path"])
              assert len(relative.parts) == 4 and relative.parts[:3] == ("knowledge", "methodology", "pdfs")
              assert item["rights"] == "PUBLIC_REDISTRIBUTION_REVIEWED"
              assert item["license"] in {"CC BY", "CC BY 4.0"}
              assert item.get("authors") and item.get("doi") and item.get("license_url")
              assert relative.as_posix() not in listed
              listed.add(relative.as_posix())
              p = root / relative
              assert p.is_file() and not p.is_symlink()
              body = p.read_bytes()
              assert body.startswith(b"%PDF-")
              assert len(body) == item["size"]
              assert hashlib.sha256(body).hexdigest() == item["sha256"]
          actual = {p.as_posix() for p in (root / "knowledge/methodology/pdfs").glob("*.pdf")}
          assert actual == listed, "Unlisted or missing PDFs"
          credits = (root / "knowledge/methodology/PDF-ATTRIBUTIONS.md").read_text()
          assert sum(line.startswith("| ") and line.split("|")[1].strip().isdigit() for line in credits.splitlines()) == 51
          print("Public PDF archive preflight PASS: 51 licensed, SHA-pinned PDFs + 51 credits")
          PY
          zip -q -r dist/MeuArtigo-PDFs-51-attributed.zip \
            knowledge/methodology/pdfs \
            knowledge/methodology/pdf_catalog.json \
            knowledge/methodology/PDF-ATTRIBUTIONS.md
          (cd dist && sha256sum MeuArtigo-PDFs-51-attributed.zip >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Publish exactly one RC.1 GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create v1.0.0-rc.1 \
            dist/MeuArtigoSkill-v1.0.0-rc.1.zip \
            dist/MeuArtigo-PDFs-51-attributed.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Meu Artigo v1.0.0-rc.1 — experimental" \
            --notes-file docs/RC1-GITHUB-PRERELEASE-NOTES.md \
            --prerelease \
            --latest=false

      - name: Verify visible release and attached assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view v1.0.0-rc.1 --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease,assets,url \
            --jq '{prerelease:.isPrerelease,url:.url,assets:[.assets[].name]}'
