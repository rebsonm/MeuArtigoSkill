name: Optional MCP Apps interface acceptance
on:
  pull_request:
    paths:
      - "integrations/mcp-apps/**"
      - "assets/research_site.html"
      - "scripts/build_research_site.py"
      - ".github/workflows/mcp-apps-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mcp-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/mcp-apps/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require exact npm lock and private-only module
        run: python scripts/audit_optional_mcp_supply_chain.py
      - name: Validate private/public ChatGPT candidate ZIP boundaries (offline)
        run: python -m unittest discover -s integrations/mcp-apps/tests -p 'test_*.py' -v
      - name: Reproducible npm install without install scripts
        working-directory: integrations/mcp-apps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependency advisories
        working-directory: integrations/mcp-apps
        run: npm audit --omit=dev --audit-level=high
      - name: Bundle portable MCP Apps browser bridge
        working-directory: integrations/mcp-apps
        run: npm run build
      - name: Verify assembled resources/read HTML and output schema (synthetic)
        working-directory: integrations/mcp-apps
        run: npm run test:ui-resource-contract
      - name: Enforce CSP declarations and reject unreviewed external UI origins (offline)
        working-directory: integrations/mcp-apps
        run: npm run test:e05-csp
      - name: Verify actual MCP stdio tool and UI resource (synthetic)
        working-directory: integrations/mcp-apps
        run: npm run test:smoke
      - name: Verify synthetic project and localized text response
        working-directory: integrations/mcp-apps
        run: npm run test:synthetic
      - name: Verify browser locale switches and fallback
        working-directory: integrations/mcp-apps
        run: npm run test:i18n
      - name: Verify ten screens in four languages and host safety contracts
        working-directory: integrations/mcp-apps
        run: npm run test:stage09
      - name: Stage 15 integrated four-projection acceptance
        working-directory: integrations/mcp-apps
        run: npm run test:stage15
      - name: Verify Stage 13 scientific privacy and advisory-only blue panel
        working-directory: integrations/mcp-apps
        run: npm run test:stage13
      - name: Verify Stage 10 single-server isolation and transport contracts
        working-directory: integrations/mcp-apps
        run: npm run test:stage10
      - name: Test Stage 11 Auth0 JWT issuer/audience/JWKS/scope and PKCE simulation
        working-directory: integrations/mcp-apps
        run: npm run test:oauth
      - name: Test Stage 11 RFC 9728 HTTP discovery and denial
        working-directory: integrations/mcp-apps
        run: npm run test:oauth-http
      - name: Verify ChatGPT-owned Drive boundary and privacy fail-closed
        working-directory: integrations/mcp-apps
        run: |
          npm run test:host-boundary
          npm run test:host-projection
          npm run test:host-projection-ui
      - name: E05 synthetic-only tunnel input guard
        working-directory: integrations/mcp-apps
        run: npm run test:e05-synthetic
      - name: Verify local authenticated Streamable HTTP transport
        working-directory: integrations/mcp-apps
        run: npm run test:http
