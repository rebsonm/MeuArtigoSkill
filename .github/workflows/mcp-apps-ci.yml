name: Optional MCP Apps npm lock bootstrap (temporary)
on:
  pull_request:
    paths:
      - 'integrations/mcp-apps/**'
      - '.github/workflows/mcp-apps-ci.yml'
permissions:
  contents: read
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve exact public npm dependencies without install scripts
        working-directory: integrations/mcp-apps
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit public dependency lock payload (compressed; contains no credentials)
        working-directory: integrations/mcp-apps
        run: |
          node -e 'const fs=require("node:fs");const z=require("node:zlib");const x=fs.readFileSync("package-lock.json");console.log("STAGE05_LOCK_BEGIN");console.log(x.toString("base64"));console.log("STAGE05_LOCK_END");'
