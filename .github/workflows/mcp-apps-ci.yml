name: Optional MCP Apps interface acceptance
on:
  pull_request:
    paths:
      - "integrations/mcp-apps/**"
      - "assets/research_site.html"
      - "scripts/build_research_site.py"
      - ".github/workflows/mcp-apps-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional MCP packages (no publish)
        working-directory: integrations/mcp-apps
        run: npm install --no-audit --no-fund
      - name: Bundle portable MCP Apps browser bridge
        working-directory: integrations/mcp-apps
        run: npm run build
      - name: Test actual MCP stdio tool and UI resource, no private project
        working-directory: integrations/mcp-apps
        run: npm run test:smoke
      - name: Verify source-backed synthetic project and localized text response
        working-directory: integrations/mcp-apps
        run: npm run test:synthetic
