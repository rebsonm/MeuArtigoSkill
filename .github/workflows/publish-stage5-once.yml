name: Stage 5 one-time English beta publication

on:
  workflow_run:
    workflows: ["Release audit"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish-english-beta:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout audited main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false

      - name: Confirm one-time release conditions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.9.0-beta.1"
          AUDITED_SHA="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          CURRENT_MAIN="$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN" = "$AUDITED_SHA"
          test -f docs/NOTAS-DA-VERSAO-0.9.0-beta.1.md
          if gh release view v0.9.0-beta.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release detected, refusing overwrite."
            exit 1
          fi
          if git ls-remote --tags origin refs/tags/v0.9.0-beta.1 | grep -q .; then
            echo "Existing tag detected, refusing overwrite."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Repeat full release and strict language audits
        run: |
          set -euo pipefail
          python scripts/release_audit.py
          python -m unittest discover -s tests -v
          python scripts/check_documentation_links.py
          python scripts/audit_public_docs.py
          python scripts/audit_source_language.py --strict
          python scripts/smoke_test_provenance.py

      - name: Build ZIP and verify checksum
        run: |
          set -euo pipefail
          python scripts/build_skill_bundle.py
          python scripts/build_skill_bundle.py --verify dist/MeuArtigoSkill-v0.9.0-beta.1.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Create immutable v0.9.0-beta.1 prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUDITED_SHA="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          gh release create v0.9.0-beta.1 \
            dist/MeuArtigoSkill-v0.9.0-beta.1.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$AUDITED_SHA" \
            --title "Meu Artigo v0.9.0-beta.1 — English-source beta" \
            --notes-file docs/NOTAS-DA-VERSAO-0.9.0-beta.1.md \
            --prerelease \
            --latest=false
