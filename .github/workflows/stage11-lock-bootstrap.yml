name: Stage 11 temporary npm lock resolution
on:
  pull_request:
    paths:
      - "integrations/mcp-apps/package.json"
      - ".github/workflows/stage11-lock-bootstrap.yml"
permissions:
  contents: read
jobs:
  npm-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Resolve npm lockfile from reviewed public registry only
        working-directory: integrations/mcp-apps
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package-lock.json","utf8"));if(p.packages[""].dependencies.jose!=="^6.1.0")process.exit(2);console.log("STAGE11_LOCK_BEGIN");console.log(fs.readFileSync("package-lock.json").toString("base64"));console.log("STAGE11_LOCK_END");'
