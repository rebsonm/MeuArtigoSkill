name: Experimental CC BY PDF intake (draft branch only)

on:
  push:
    branches:
      - exp/drive-conceptual-rag-pilot-20261120
    paths:
      - experimental/conceptual_rag/import_licensed_pdfs_once.py

permissions:
  contents: write

jobs:
  intake:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
          fetch-depth: 1
          ref: exp/drive-conceptual-rag-pilot-20261120

      - name: Download only explicitly license-reviewed open articles
        run: python experimental/conceptual_rag/import_licensed_pdfs_once.py

      - name: Commit original PDF bytes and citation/rights metadata to draft only
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "exp/drive-conceptual-rag-pilot-20261120"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- knowledge/methodology/pdfs/ knowledge/methodology/pdf_catalog.json
          if git diff --cached --quiet; then
            echo "No approved new PDFs were downloaded; no commit"
            exit 0
          fi
          git commit -m "docs(experimental): add verified CC BY methodological PDF originals"
          git push origin "HEAD:refs/heads/exp/drive-conceptual-rag-pilot-20261120"
