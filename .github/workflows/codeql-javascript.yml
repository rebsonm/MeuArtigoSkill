name: Stage 04 - CodeQL JavaScript and TypeScript
on:
  pull_request:
    paths:
      - 'integrations/mcp-apps/**'
      - 'mcp-preview/**'
      - '.github/workflows/codeql-javascript.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-javascript-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      source_exists: ${{ steps.find.outputs.source_exists }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Determine whether optional JavaScript is present
        id: find
        run: |
          if find integrations/mcp-apps mcp-preview -type f \( -name '*.mjs' -o -name '*.js' -o -name '*.ts' \) -print -quit 2>/dev/null | grep -q .; then
            echo 'source_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source_exists=false' >> "$GITHUB_OUTPUT"
          fi
  codeql:
    needs: detect
    if: needs.detect.outputs.source_exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Initialize JavaScript/TypeScript CodeQL only
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4 checked on 2026-10-16
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze JavaScript/TypeScript locally (repository uses default CodeQL setup)
        id: analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: stage04/javascript-typescript
          upload: never
          output: ${{ runner.temp }}/meu-artigo-js-sarif
      - name: Check local SARIF security severities (no Code Scanning upload)
        run: python scripts/audit_codeql_sarif.py --directory "${{ runner.temp }}/meu-artigo-js-sarif"
      - name: Preserve SARIF for independent manual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage05-javascript-codeql-local-sarif
          path: ${{ runner.temp }}/meu-artigo-js-sarif
          if-no-files-found: warn
          retention-days: 30
