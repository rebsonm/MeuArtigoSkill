name: Temporary offline translation of public cards
on:
  push:
    branches: [i18n/translate-md-20261122]

permissions:
  contents: write

jobs:
  translate:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated translation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install offline translation runtime
        run: python -m pip install 'argostranslate>=1.10,<2' 'langid>=1.1,<2'
      - name: Translate all remaining eligible source cards and reconcile catalogues
        run: |
          python tools/translate_markdown_corpus.py --limit 475 --report /tmp/translation-pilot.json
          python scripts/reconcile_methodology_library.py --check
      - name: Preserve translation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-i18n-source-remaining-not-scientific-approval
          path: /tmp/translation-pilot.json
          if-no-files-found: warn
          retention-days: 30
      - name: Push only to isolated translation branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/i18n/translate-md-20261122'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add knowledge/methodology/source_cards knowledge/methodology/source_registry_catalog.json knowledge/methodology/intake/operational-validation.json
          if git diff --cached --quiet; then
            echo NO_CHANGES
          else
            git commit -m 'docs(i18n): translate first prospecting cards and reconcile source hashes'
            git push origin HEAD:i18n/translate-md-20261122
          fi
