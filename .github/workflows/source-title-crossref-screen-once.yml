name: One-time source bibliography metadata rights screening (draft only)

on:
  push:
    branches: [exp/drive-conceptual-rag-pilot-20261120]
    paths:
      - .github/workflows/source-title-crossref-screen-once.yml

permissions:
  contents: write

jobs:
  source-screen:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: exp/drive-conceptual-rag-pilot-20261120
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check source title against DOI and publisher licenses without authorizing PDF publication
        run: python experimental/conceptual_rag/screen_source_titles_crossref.py
      - name: Commit neutral metadata findings to isolated draft source catalogue
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "exp/drive-conceptual-rag-pilot-20261120"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- knowledge/methodology/intake/rights-ledger-part-0*.json knowledge/methodology/intake/rights-ledger-manifest.json
          if git diff --cached --quiet; then
            echo "No new metadata screen results"
            exit 0
          fi
          git commit -m "docs(curation): record source DOI and publisher license metadata candidates"
          git push origin HEAD:refs/heads/exp/drive-conceptual-rag-pilot-20261120
