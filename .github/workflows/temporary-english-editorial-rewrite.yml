name: One-shot English editorial correction
on:
  push:
    branches: [docs/english-cleanup-two-round-20261122]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Replace all 582 unsafe machine translations and reconcile catalogues
        run: |
          python tools/one_shot_english_editorial_rewrite.py
          python scripts/reconcile_methodology_library.py --check
      - name: Preserve exact correction receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-english-editorial-remediation
          path: /tmp/english-remediation-receipt.json
          if-no-files-found: warn
          retention-days: 60
      - name: Remove one-shot writer and commit the English cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/temporary-english-editorial-rewrite.yml tools/one_shot_english_editorial_rewrite.py
          git add knowledge/methodology/source_cards knowledge/methodology/cards knowledge/methodology/catalog.json knowledge/methodology/source_registry_catalog.json knowledge/methodology/intake/operational-validation.json docs/ALL-MARKDOWN-LANGUAGE-STATUS.md
          git commit -m 'docs(i18n): replace 582 unreliable translations with metadata-grounded English guidance'
          git push origin HEAD:docs/english-cleanup-two-round-20261122
