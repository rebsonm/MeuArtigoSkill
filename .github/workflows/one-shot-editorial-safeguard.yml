name: One-shot scientific-status safeguard for translated editorial cards
on:
  push:
    branches: [i18n/translate-editorial-cards-20261122]
permissions:
  contents: write
jobs:
  safeguard:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Repair the historical review markers and protect curated cards
        run: |
          python tools/safeguard_editorial_translations.py
          python scripts/reconcile_methodology_library.py --check
      - name: Remove write-enabled workflow, commit and push sanitized cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-editorial-safeguard.yml
          git add knowledge/methodology/cards knowledge/methodology/catalog.json knowledge/methodology/intake/operational-validation.json
          git commit -m 'fix(i18n): restore reviewed cards and guard machine translated editorial status'
          git push origin HEAD:i18n/translate-editorial-cards-20261122
