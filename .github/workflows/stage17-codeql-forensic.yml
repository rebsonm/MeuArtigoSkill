name: Stage17 CodeQL Python sensitive-output gate
on:
  pull_request: {}
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Initialize CodeQL Python against candidate HEAD
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze WITHOUT uploading to Code Scanning
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          upload: never
          output: ${{ runner.temp }}/stage17-python-sarif
          category: stage17/python-sensitive-output
      - name: Audit SARIF extension rule severities without exposing source content
        run: |
          python scripts/audit_codeql_sarif.py \
            --directory "${RUNNER_TEMP}/stage17-python-sarif" \
            --acknowledge-synthetic-drive-f7-fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage17-python-sensitive-output-sarif
          path: ${{ runner.temp }}/stage17-python-sarif
          if-no-files-found: warn
          retention-days: 7
