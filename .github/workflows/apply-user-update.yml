name: Apply user improvement package

on:
  push:
    branches: [main]
    paths:
      - ".update/**"
      - ".github/workflows/apply-user-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply vetted delta
        shell: python
        run: |
          from pathlib import Path
          import base64
          import io
          import zipfile

          allowed = {
              ".github/workflows/release-audit.yml",
              "CHANGELOG.md",
              "README.md",
              "SKILL.md",
              "docs/GOVERNANCA-CIENTIFICA.md",
              "references/anonymization.md",
              "references/project-state.md",
              "references/scientific-governance.md",
              "references/spreadsheet-template.md",
              "scripts/audit_anonymization.py",
              "scripts/dedupe_records.py",
              "scripts/governance_events.py",
              "scripts/validate_project.py",
              "references/workflow-stages.md",
              "references/storage-mapping.md",
              "docs/EXEMPLO-FLUXO.md",
              "tests/test_controls.py",
          }

          chunks = sorted(Path(".update").glob("chunk-*.b64"))
          if len(chunks) != 10:
              raise SystemExit(f"expected 10 delta chunks, found {len(chunks)}")

          encoded = "".join(p.read_text(encoding="utf-8") for p in chunks)
          raw = base64.b64decode(encoded, validate=True)

          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names = set(z.namelist())
              if names != allowed:
                  missing = sorted(allowed - names)
                  extra = sorted(names - allowed)
                  raise SystemExit(f"delta paths differ from allow-list; missing={missing}; extra={extra}")

              for name in sorted(names):
                  target = Path(name)
                  if target.is_absolute() or ".." in target.parts:
                      raise SystemExit(f"unsafe archive path: {name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))

          for p in chunks:
              p.unlink()
          Path(".update").rmdir()
          Path(".github/workflows/apply-user-update.yml").unlink()

      - name: Static release audit
        run: python scripts/release_audit.py

      - name: Behavioral regression tests
        run: python -m unittest discover -s tests -v

      - name: Provenance smoke test
        run: python scripts/smoke_test_provenance.py

      - name: Commit vetted replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply MeuArtigoSkill improvement package"
          git push
