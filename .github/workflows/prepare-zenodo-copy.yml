name: Prepare pinned Zenodo source-review copy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RIGHTSHOLDER-NOTICE.md"
      - "README.md"
      - "NOTICE"
      - "docs/ZENODO-DEPOSIT-PREPARATION.md"
      - "docs/zenodo-metadata-draft.json"
      - "knowledge/methodology/PDF-ATTRIBUTIONS.md"
      - ".github/workflows/prepare-zenodo-copy.yml"
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact public HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Produce public source archive without third-party PDFs
        run: |
          python scripts/build_zenodo_review_copy.py --output "$RUNNER_TEMP/zenodo-review"
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zenodo-review'
          archive, = p.glob('MeuArtigo-zenodo-source-review-*.zip')
          recorded = (p/'SHA256SUMS-zenodo-review.txt').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == recorded
          with zipfile.ZipFile(archive) as zf:
              assert zf.testzip() is None
              assert not any(n.lower().endswith('.pdf') for n in zf.namelist())
          print('ZENODO_SOURCE_REVIEW_COPY_PASS', archive, recorded)
          PY
      - name: Upload reviewable archive and sidecar checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenodo-public-source-copy
          path: ${{ runner.temp }}/zenodo-review/*
          if-no-files-found: error
          retention-days: 90
