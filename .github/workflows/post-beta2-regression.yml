name: Post-beta2 corrective regressions
on:
  push:
    branches: ["fix/post-beta2-plugin-migration-20261011"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Static release audit
        run: python scripts/release_audit.py
      - name: Complete Python regression
        run: python -m unittest discover -s tests -v
      - name: Documentation link audit
        run: python scripts/check_documentation_links.py
      - name: Sensitive public docs audit
        run: python scripts/audit_public_docs.py
      - name: English source audit
        run: python scripts/audit_source_language.py
      - name: Provenance smoke test
        run: python scripts/smoke_test_provenance.py
      - name: Deterministic package verification
        run: |
          python scripts/build_skill_bundle.py
          python scripts/build_skill_bundle.py --verify "dist/MeuArtigoSkill-v$(cat VERSION).zip"
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Build second distribution and audit unpublished candidates
        run: |
          python scripts/build_plugin_bundle.py
          python scripts/audit_candidate_bundles.py
          (cd dist && sha256sum -c CANDIDATE_SHA256SUMS.txt)
          python scripts/check_release_metadata.py > dist/NOT_PUBLISHED_CHECK.txt && exit 1 || test $? -eq 1
      - name: Upload engineering candidates for reviewer download (never publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MeuArtigo-unpublished-review-candidates
          path: |
            dist/MeuArtigoSkill-v*.zip
            dist/MeuArtigoPlugin-v*-candidate.zip
            dist/SHA256SUMS.txt
            dist/CANDIDATE_SHA256SUMS.txt
            dist/CANDIDATE_VERIFICATION.json
            dist/BUNDLE_BUILD_RECEIPT.json
            dist/PLUGIN_BUILD_RECEIPT.json
            dist/NOT_PUBLISHED_CHECK.txt
          if-no-files-found: error
          retention-days: 30
