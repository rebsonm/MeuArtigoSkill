name: One-off CC BY 4.0 methodological journal intake (draft only)

on:
  push:
    branches: [exp/drive-conceptual-rag-pilot-20261120]
    paths:
      - experimental/conceptual_rag/import_plos_ccby4_batch.py
      - .github/workflows/import-plos-ccby4-once.yml

permissions:
  contents: write

jobs:
  source-intake:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: exp/drive-conceptual-rag-pilot-20261120
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Import only PLOS originals with explicit Crossref version-of-record CC BY 4.0
        run: python experimental/conceptual_rag/import_plos_ccby4_batch.py
      - name: Commit approved original PDFs and attribution (draft branch only)
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "exp/drive-conceptual-rag-pilot-20261120"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- knowledge/methodology/pdfs knowledge/methodology/pdf_catalog.json
          if git diff --cached --quiet; then
            echo "No additional license-verified original PDF, no push"
            exit 0
          fi
          git commit -m "feat(corpus): append PLOS CC BY original methodology PDFs with checked license and DOI"
          git push origin HEAD:refs/heads/exp/drive-conceptual-rag-pilot-20261120
