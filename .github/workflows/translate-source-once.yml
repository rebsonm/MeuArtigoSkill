name: Temporary English-source migration probe

on:
  push:
    branches:
      - stage5-english-source-auto-user-language-20261009
    paths:
      - '.github/workflows/translate-source-once.yml'
      - 'scripts/translate_source_once.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public machine-translation reachability (no research data)
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import urllib.parse, urllib.request
          url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=pt&tl=en&dt=t&q="+urllib.parse.quote("Este é um teste de conectividade.")
          try:
              with urllib.request.urlopen(url,timeout=20) as reply:
                  data=reply.read(400).decode("utf-8","replace")
                  print("PUBLIC_TEST_STATUS",reply.status,"RESULT",data[:280])
          except Exception as exc:
              print("PUBLIC_TEST_FAILED",type(exc).__name__,str(exc)[:200])
              raise
          sample="## 1. Família de revisão\\n\\nZXQSEGMENT001ZXQ\\n\\nA revisão identifica fontes e resultados da pesquisa.\\n\\nZXQSEGMENT002ZXQ\\n\\n- **Atenção:** conferir [documentação](ZXQLINK001ZXQ)."
          url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=pt&tl=en&dt=t&q="+urllib.parse.quote(sample)
          with urllib.request.urlopen(url,timeout=20) as reply:
              import json
              result=json.load(reply)
          print("MARKER_PROBE",repr("".join(x[0] for x in result[0])))
          PY
