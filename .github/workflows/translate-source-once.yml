name: Temporary English-source migration

on:
  push:
    branches:
      - stage5-english-source-auto-user-language-20261009
    paths:
      - '.github/workflows/translate-source-once.yml'
      - 'scripts/translate_python_source_once.py'

permissions:
  contents: write

jobs:
  translate-public-documentation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout authorized development branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: stage5-english-source-auto-user-language-20261009
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Translate public source-code display strings while preserving schema and identifiers
        shell: bash
        run: |
          python scripts/translate_python_source_once.py
      - name: Record translation only on development branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/build_matrix_template.py scripts/method_routes.py scripts/init_project.py scripts/editorial_ai_disclosure.py scripts/release_audit.py
          if ! git diff --cached --quiet; then
            git commit -m "stage5: translate program display strings into English [skip ci]"
            git push origin HEAD:stage5-english-source-auto-user-language-20261009
          else
            echo "No changes to commit"
          fi
      - name: Report unresolved Portuguese language signals
        run: python scripts/audit_source_language.py
