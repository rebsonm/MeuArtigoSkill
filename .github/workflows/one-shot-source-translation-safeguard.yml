name: One-shot provenance safeguard for public bibliography translations
on:
  push:
    branches: [i18n/translate-md-20261122]
permissions:
  contents: write
jobs:
  safeguard:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore authoritative scientific and rights guards
        run: |
          python tools/safeguard_public_translation.py
          python scripts/reconcile_methodology_library.py --check
      - name: Remove temporary write-enabled workflows before publishing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-source-translation-safeguard.yml .github/workflows/temporary-public-i18n-pilot.yml
          git add knowledge/methodology/source_cards knowledge/methodology/source_registry_catalog.json knowledge/methodology/intake/operational-validation.json
          git commit -m 'fix(i18n): guard 473 public draft translations and remove temporary writers'
          git push origin HEAD:i18n/translate-md-20261122
