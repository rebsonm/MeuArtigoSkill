name: Final targeted editorial quality pass
on:
  push:
    branches: [docs/english-cleanup-two-round-20261122]
permissions:
  contents: write
jobs:
  polish:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore existing substantive English and sharpen editorial guidance
        run: |
          python tools/second_pass_english_editorial.py
          python scripts/reconcile_methodology_library.py --check
      - name: Preserve second-round quality receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: second-round-quality-receipt
          path: /tmp/english-quality-pass.json
          if-no-files-found: warn
          retention-days: 60
      - name: Remove writer and commit validated second-round cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/temporary-second-pass-quality.yml tools/second_pass_english_editorial.py
          git add knowledge/methodology/cards knowledge/methodology/catalog.json knowledge/methodology/intake/operational-validation.json docs/ALL-MARKDOWN-LANGUAGE-STATUS.md
          git commit -m 'docs(i18n): restore substantive English method cards and sharpen topic-specific cautions'
          git push origin HEAD:docs/english-cleanup-two-round-20261122
