name: Release audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static release audit
        run: python scripts/release_audit.py

      - name: Upload installable Skill bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MeuArtigoSkill
          path: |
            SKILL.md
            agents/
            assets/
            references/
            scripts/
            docs/
            README.md
            CHANGELOG.md
            VERSION
            CITATION.cff
          if-no-files-found: error
          retention-days: 30
