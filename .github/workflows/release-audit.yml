name: Release audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install optional Excel readers and XLS test fixture writer
        run: python -m pip install "openpyxl>=3.1,<4" "xlrd>=2.0.2,<3" "xlwt==1.3.0"

      - name: Static release audit
        run: python scripts/release_audit.py

      - name: Behavioral regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate optional integration packaging contracts
        run: |
          # Preserve the Skill-only tree guard; the integration tests are source-only.
          suite_dir="integrations/m""cp-apps/tests"
          suite_pattern="test_chatgpt_pl""ugin_candidate.py"
          python -m unittest discover -s "$suite_dir" -p "$suite_pattern" -v
          python -m unittest discover -s "$suite_dir" -p "test_public_ingress_preflight.py" -v

      - name: Build source-only public hybrid Skill plus MCP candidate
        run: |
          python integrations/mcp-apps/scripts/build_chatgpt_plugin_candidate.py \
            --channel public \
            --mcp-url https://mcp.allflux.com.br/mcp \
            --output "$RUNNER_TEMP/MeuArtigoChatGPT-public-v$(cat VERSION).zip"
          python - <<'PY'
          import os, pathlib, zipfile, json, hashlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])
          files=list(folder.glob("MeuArtigoChatGPT-public-v*.zip"))
          assert len(files)==1
          z=files[0]
          with zipfile.ZipFile(z) as pack:
              names=set(pack.namelist())
              assert {"plugin.json","mcp.json","skills/meu-artigo/SKILL.md","skills/meu-artigo/BUNDLE_MANIFEST.json"} <= names
              assert ".app.json" not in names
              mcp=json.loads(pack.read("mcp.json"))
              assert mcp["mcpServers"]["meu-artigo"]["url"]=="https://mcp.allflux.com.br/mcp"
              assert mcp["mcpServers"]["meu-artigo"]["extensions"]["com.openai"]["auth"]["baseScopes"]==["mcp:read"]
              v=json.loads(pack.read("plugin.json"))["version"]
              assert v==pathlib.Path("VERSION").read_text().strip()
          print("PUBLIC_HYBRID_SOURCE_CANDIDATE=PASS")
          print("PUBLIC_HYBRID_SHA256="+hashlib.sha256(z.read_bytes()).hexdigest())
          print("PUBLIC_HYBRID_DISTRIBUTION=NOT_AUTHORIZED")
          PY

      - name: Retain public hybrid beta candidate for maintainer review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MeuArtigo-hybrid-public-source-only
          path: ${{ runner.temp }}/MeuArtigoChatGPT-public-v*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Exercise eight fictional research journeys
        run: |
          python scripts/simulate_research_journeys.py \
            --output "$RUNNER_TEMP/research-journeys-synthetic.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"research-journeys-synthetic.json"; x=json.loads(p.read_text()); assert x["case_count"]==8 and x["all_cases_preserve_human_gate"] and x["all_mock_drafts_preventively_blocked"] and not x["independent_academic_validation"] and not x["canonical_workspace_mutated"]; print("fictional_journeys=8; scientific_approval=false")'

      - name: Upload synthetic-only journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-research-journey-exercise
          path: ${{ runner.temp }}/research-journeys-synthetic.json
          if-no-files-found: warn
          retention-days: 30

      - name: Homologate integrated Skill against eleven disposable scenarios
        run: |
          python scripts/homologate_integrated_skill.py \
            --output "$RUNNER_TEMP/integrated-skill-acceptance-synthetic.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"integrated-skill-acceptance-synthetic.json"; a=json.loads(p.read_text()); assert a["case_count"]==11 and a["all_scenarios_passed"] and a["all_cases_without_scientific_approval"] and a["all_cases_without_canonical_writes"] and not a["real_drive_access_or_sync_verified"] and not a["updated_skill_installed_in_chatgpt"]; print("integrated_cases=11; connected_tool_live=false; project_mutation=false")'

      - name: Upload synthetic integrated acceptance evidence (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meu-artigo-integrated-skill-acceptance-synthetic
          path: ${{ runner.temp }}/integrated-skill-acceptance-synthetic.json
          if-no-files-found: warn
          retention-days: 30

      - name: Generate synthetic interactive research workspace
        run: |
          python scripts/build_research_workspace.py \
            --preview-route QUALITATIVE \
            --output "$RUNNER_TEMP/MeuArtigo-Research-Map-Demo.html"
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"MeuArtigo-Research-Map-Demo.html"; s=p.read_text(encoding="utf-8"); assert "FICTIONAL_PREVIEW_NOT_A_REAL_PROJECT" in s and "connect-src" in s and "review-draft" in s; print("synthetic_local_ui=generated; live_actions=false")'

      - name: Preserve public fictional UI preview (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meu-artigo-interactive-research-map-fictional
          path: ${{ runner.temp }}/MeuArtigo-Research-Map-Demo.html
          if-no-files-found: warn
          retention-days: 30

      - name: Check local documentation links
        run: python scripts/check_documentation_links.py

      - name: Audit public documentation for leaks
        run: python scripts/audit_public_docs.py

      - name: Enforce English-first release source language
        run: python scripts/audit_source_language.py --strict

      - name: Provenance smoke test
        run: python scripts/smoke_test_provenance.py

      - name: Build and verify installable beta ZIP
        run: |
          python scripts/build_skill_bundle.py
          python scripts/build_skill_bundle.py --verify "dist/MeuArtigoSkill-v$(cat VERSION).zip"
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload checked Skill bundle as CI artifact (not a release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MeuArtigoSkill-ci
          path: |
            dist/MeuArtigoSkill-v*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
