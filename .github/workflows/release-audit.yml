name: Release audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install optional Excel readers and XLS test fixture writer
        run: python -m pip install "openpyxl>=3.1,<4" "xlrd>=2.0.2,<3" "xlwt==1.3.0"

      - name: Static release audit
        run: python scripts/release_audit.py

      - name: Verify individual operational library dispositions
        run: python scripts/reconcile_methodology_library.py --check

      - name: Verify every catalogued public PDF against its SHA-256
        run: |
          python scripts/audit_public_pdf_release.py --verify-only \
            --out-json "$RUNNER_TEMP/public-pdf-preflight.json" \
            --out-credits "$RUNNER_TEMP/public-pdf-credits-draft.md"

      - name: Preserve rights preflight and draft credits (not legal clearance)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-pdf-rights-preflight-not-release
          path: |
            ${{ runner.temp }}/public-pdf-preflight.json
            ${{ runner.temp }}/public-pdf-credits-draft.md
          if-no-files-found: warn
          retention-days: 30

      - name: Behavioral regression tests
        run: python -m unittest discover -s tests -v

      - name: Exercise eight fictional research journeys
        run: |
          python scripts/simulate_research_journeys.py \
            --output "$RUNNER_TEMP/research-journeys-synthetic.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"research-journeys-synthetic.json"; x=json.loads(p.read_text()); assert x["case_count"]==8 and x["all_cases_preserve_human_gate"] and x["all_mock_drafts_preventively_blocked"] and not x["independent_academic_validation"] and not x["canonical_workspace_mutated"]; print("fictional_journeys=8; scientific_approval=false")'

      - name: Upload synthetic-only journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-research-journey-exercise
          path: ${{ runner.temp }}/research-journeys-synthetic.json
          if-no-files-found: warn
          retention-days: 30

      - name: Homologate integrated Skill against eleven disposable scenarios
        run: |
          python scripts/homologate_integrated_skill.py \
            --output "$RUNNER_TEMP/integrated-skill-acceptance-synthetic.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"integrated-skill-acceptance-synthetic.json"; a=json.loads(p.read_text()); assert a["case_count"]==11 and a["all_scenarios_passed"] and a["all_cases_without_scientific_approval"] and a["all_cases_without_canonical_writes"] and not a["real_drive_access_or_sync_verified"] and not a["updated_skill_installed_in_chatgpt"]; print("integrated_cases=11; connected_tool_live=false; project_mutation=false")'

      - name: Upload synthetic integrated acceptance evidence (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meu-artigo-integrated-skill-acceptance-synthetic
          path: ${{ runner.temp }}/integrated-skill-acceptance-synthetic.json
          if-no-files-found: warn
          retention-days: 30

      - name: Generate synthetic interactive research workspace
        run: |
          python scripts/build_research_workspace.py \
            --preview-route QUALITATIVE \
            --output "$RUNNER_TEMP/MeuArtigo-Research-Map-Demo.html"
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"MeuArtigo-Research-Map-Demo.html"; s=p.read_text(encoding="utf-8"); assert "FICTIONAL_PREVIEW_NOT_A_REAL_PROJECT" in s and "connect-src" in s and "review-draft" in s; print("synthetic_local_ui=generated; live_actions=false")'

      - name: Preserve public fictional UI preview (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meu-artigo-interactive-research-map-fictional
          path: ${{ runner.temp }}/MeuArtigo-Research-Map-Demo.html
          if-no-files-found: warn
          retention-days: 30

      - name: Check local documentation links
        run: python scripts/check_documentation_links.py

      - name: Audit public documentation for leaks
        run: python scripts/audit_public_docs.py

      - name: Scan all tracked source files for high-confidence credentials
        run: python scripts/audit_repository_secrets.py

      - name: Enforce English-first release source language
        run: python scripts/audit_source_language.py --strict

      - name: Inventory all Markdown language (informational, no false certification)
        run: |
          python scripts/audit_all_markdown_language.py > "$RUNNER_TEMP/all-markdown-language.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"all-markdown-language.json"; x=json.loads(p.read_text(encoding="utf-8")); print("markdown_scanned=",x["markdown_files_scanned"],"candidates_for_review=",x["files_requiring_editorial_language_review"],"english_only_verified=",x["english_only_verified"])'

      - name: Preserve full Markdown language inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: all-markdown-language-inventory-not-certification
          path: ${{ runner.temp }}/all-markdown-language.json
          if-no-files-found: warn
          retention-days: 30

      - name: Provenance smoke test
        run: python scripts/smoke_test_provenance.py

      - name: Verify candidate or published RC source metadata
        id: rc
        shell: bash
        run: |
          if [[ "$(cat VERSION)" =~ -rc\.[1-9][0-9]*$ ]]; then
            if [[ "$(cat VERSION)" == "$(cat OFFICIAL_SKILL_RELEASE)" ]]; then
              python scripts/check_release_metadata.py --published-source
            else
              python scripts/check_release_metadata.py --candidate
            fi
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify installable Skill ZIP
        run: |
          python scripts/build_skill_bundle.py
          python scripts/build_skill_bundle.py --verify "dist/MeuArtigoSkill-v$(cat VERSION).zip"
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Package reviewed PDFs in a separate trial ZIP
        if: github.event_name == 'pull_request' && steps.rc.outputs.eligible == 'true'
        run: |
          python scripts/build_reviewed_pdf_candidate.py \
            --base-zip "dist/MeuArtigoSkill-v$(cat VERSION).zip" \
            --out "$RUNNER_TEMP/MeuArtigoSkill-v$(cat VERSION)-PDFs-TEST-ONLY.zip"

      - name: Upload PDF-bearing TEST-ONLY ZIP separately from installable Skill
        if: github.event_name == 'pull_request' && steps.rc.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MeuArtigoSkill-PDFs-TEST-ONLY-NOT-RELEASE
          path: ${{ runner.temp }}/MeuArtigoSkill-v*-PDFs-TEST-ONLY.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload checked Skill bundle as CI artifact (not a release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MeuArtigoSkill-ci
          path: |
            dist/MeuArtigoSkill-v*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload RC installation ZIP for controlled review (not a release)
        if: github.event_name == 'pull_request' && steps.rc.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MeuArtigoSkill-rc-test-only
          path: |
            dist/MeuArtigoSkill-v*.zip
            dist/SHA256SUMS.txt
            dist/BUNDLE_BUILD_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
