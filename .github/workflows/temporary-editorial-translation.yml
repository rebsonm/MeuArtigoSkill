name: Temporary offline translation of editorial cards
on:
  push:
    branches: [i18n/translate-editorial-cards-20261122]

permissions:
  contents: write

jobs:
  translate:
    if: github.repository == 'rebsonm/MeuArtigoSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated methodology branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install offline translation runtime
        run: python -m pip install 'argostranslate>=1.10,<2' 'langid>=1.1,<2'
      - name: Translate unfrozen editorial cards and reconcile hashes
        run: |
          python tools/translate_editorial_cards.py --limit 174 --report /tmp/editorial-translation-report.json
          python scripts/reconcile_methodology_library.py --check
      - name: Preserve editorial translation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editorial-card-machine-translation-needs-fidelity-review
          path: /tmp/editorial-translation-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit only to the isolated editorial branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/i18n/translate-editorial-cards-20261122'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add knowledge/methodology/cards knowledge/methodology/catalog.json knowledge/methodology/intake/operational-validation.json
          if git diff --cached --quiet; then
            echo NO_CHANGES
          else
            git commit -m 'docs(i18n): offline editorial translations, pending fidelity review'
            git push origin HEAD:i18n/translate-editorial-cards-20261122
          fi
