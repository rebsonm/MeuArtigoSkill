<title>Meu Artigo • Protótipo visual navegável</title>
<style>
:root{--ink:#102047;--muted:#667a96;--line:#dde7f5;--green:#0B57D0;--green-light:#eaf2ff;--soft:#f7faff;--amber:#8b5d14;--amber-light:#fff5e3;--panel:#fff;--bg:#f2f6fb;--blue:#2563EB;--blue-dark:#093d9b}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}body{margin:0;background:var(--bg);font-size:14px}
button,input,select{font:inherit}.skip-link{position:absolute;top:-90px;left:12px;z-index:1000;background:#fff;color:#073b91;padding:12px;border:3px solid #0B57D0;border-radius:8px}.skip-link:focus{top:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #4f8bea;outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}
.shell{max-width:1460px;margin:18px auto;box-shadow:0 14px 50px #122e5c12;border:1px solid var(--line);border-radius:17px;background:#fff;overflow:hidden;min-height:710px}
.header{min-height:67px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 26px;background:#fff}
.wordmark{font-size:15px;font-weight:750;letter-spacing:-.025em}.wordmark .mark{display:inline-grid;place-items:center;background:var(--green-light);color:var(--green);width:35px;height:35px;border-radius:10px;margin-right:10px;font-size:13px;letter-spacing:0}.wordmark em{font-style:normal;color:#91a0b7;font-weight:450}
.header-right{display:flex;align-items:center;gap:12px}.mock-badge{border-radius:18px;background:var(--amber-light);color:var(--amber);font-size:11px;font-weight:700;padding:8px 11px;white-space:nowrap}.outline-btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12px;color:#52656c;font-weight:600}.outline-btn:hover{background:var(--soft)}
.layout{display:grid;grid-template-columns:226px minmax(0,1fr);min-height:640px}.nav{border-right:1px solid var(--line);background:#f9fbff;padding:24px 12px;display:flex;flex-direction:column;gap:3px}.nav-label{padding:1px 12px 14px;color:#8a9bb5;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;text-align:left;padding:12px 12px;background:transparent;color:#62748f;border-radius:9px;font-size:12.5px}.nav button:hover{background:#edf4ff;color:#0946ad}.nav button.active{background:var(--green-light);color:var(--green);font-weight:700}.nav button .sym{display:inline-flex;align-items:center;justify-content:center;width:20px;font-size:15px}.nav-help{padding:13px 12px 0;color:#8799b2;line-height:1.55;font-size:11px;margin-top:auto}.main{padding:30px 34px 26px;background:#fff;min-width:0}
.page-top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}.eyebrow{font-size:10.5px;letter-spacing:.11em;font-weight:800;color:#0B57D0;text-transform:uppercase}.page-title{font-size:25px;line-height:1.14;letter-spacing:-.035em;font-weight:790;margin:9px 0}.subtitle{color:#7a8ba3;font-size:12.5px;line-height:1.5;margin:4px 0 0}.stage{background:var(--amber-light);border-radius:8px;color:#0b57d0;padding:11px 13px;font-size:11px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}.kpi{border:1px solid var(--line);border-radius:14px;padding:15px;min-height:116px}.kpi .label{font-size:11px;color:#83949b;line-height:1.4}.kpi strong{display:block;font-size:28px;letter-spacing:-.05em;margin:8px 0 2px}.kpi small{color:#92a0a7;font-size:10.5px}
.cols{display:grid;grid-template-columns:1.08fr 1fr;gap:15px;margin-top:14px}.pane{border:1px solid var(--line);border-radius:14px;padding:21px;min-width:0}.pane.tinted{background:#f2f7ff}.pane h3{font-size:14px;letter-spacing:-.02em;margin:0 0 11px}.pane h2{font-size:17px;line-height:1.35;letter-spacing:-.03em;margin:8px 0}.pane p{color:#819099;font-size:12px;line-height:1.55;margin:8px 0 15px}.mini-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#88999e;font-weight:800}
.primary{background:var(--green);color:white;border:0;border-radius:8px;padding:11px 16px;font-size:12px;font-weight:700}.primary:hover{background:#0943ae}.secondary{border:1px solid #c8daf4;background:#fff;color:var(--green);border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700}.secondary:hover{background:var(--green-light)}
.gates{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:22px 0}.gate-dot{width:27px;height:27px;border-radius:50%;border:2px solid #dfe6e4;display:grid;place-items:center;color:#98a6aa;font-weight:750;font-size:12px;background:#fff;flex-shrink:0}.gate-dot.done{background:#0B57D0;color:#fff;border-color:#0B57D0}.gate-dot.now{color:#0b57d0;border-color:#2563eb;background:#f0f6ff}.g-line{height:2px;flex:1;background:#e0e9f7;min-width:4px}.footnote{font-size:10.5px;color:#9aa9ae;line-height:1.5}.source-line{margin-top:24px;color:#93a1a7;font-size:11px;border-top:1px solid #e4ecf6;padding-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.info{background:#f2f7ff;border:1px solid #d8e8fc;border-radius:12px;padding:15px 17px;color:#3a628e;font-size:12px;line-height:1.5}.amber{background:#fff8e9;border-color:#f2dfbb;color:#906524}
.section-heading{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:18px}.section-heading h2{font-size:23px;letter-spacing:-.04em;margin:0 0 5px}.section-heading p{font-size:12px;color:#8a9ca3;margin:0}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{background:#f7faff;color:#778991;font-size:11px;font-weight:700}th,td{padding:15px 12px;border-bottom:1px solid #e9eeee}td{color:#4e646d}td:first-child{font-weight:750;color:#40585f}tr:last-child td{border:0}.pill{display:inline-block;padding:6px 9px;border-radius:30px;background:#eef3f3;color:#5a727b;font-size:10px;font-weight:700}.pill.green{background:#e8f2ff;color:#0B57D0}.pill.yellow{background:#fff4e0;color:#a06d20}
.list{display:grid;gap:11px}.line-item{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;align-items:start;gap:14px}.line-item .bubble{display:grid;place-items:center;border-radius:10px;background:#e9f2ff;color:var(--green);width:39px;height:39px;flex-shrink:0;font-weight:800}.line-item h3{margin:0 0 4px;font-size:13px}.line-item p{margin:0;color:#85949c;font-size:12px;line-height:1.5}.line-item .right{margin-left:auto;white-space:nowrap}.quiet{font-size:11px;color:#8ca0a7}.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;max-width:280px}.mini-select{border:1px solid var(--line);border-radius:8px;padding:9px;background:white;color:#53686f;font-size:12px}.stack{display:grid;gap:15px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.count{font-size:27px;font-weight:800;letter-spacing:-.045em}.option{border:1px solid var(--line);padding:17px;border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s,background .15s,box-shadow .15s}.option:hover{border-color:#bfd3f6;background:#fbfdff}.option h3{margin:0 0 7px;color:#152750}.option p{font-size:12px;line-height:1.5;color:#6d819f}.option.selected{border-color:#2563EB;background:linear-gradient(180deg,#edf4ff 0%,#f8fbff 100%);box-shadow:0 8px 20px #0b57d014}.option.selected h3{color:#0B57D0}.option.selected p{color:#36527a}.option.selected .pill.green{background:#0B57D0;color:#fff;box-shadow:0 2px 6px #0b57d022}.detail{min-height:100px}.danger-note{font-size:11px;color:#a16e22;background:#fff8e8;border-radius:8px;padding:9px 11px}
@media(max-width:930px){.layout{grid-template-columns:190px minmax(0,1fr)}.main{padding:23px}.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.header{padding:10px 19px}}
@media(max-width:650px){.shell{margin:0;border-radius:0;min-height:100vh}.header{min-height:65px;padding:10px 13px}.header-right{gap:6px}.header-right .outline-btn{display:none}.layout{display:block}.nav{display:flex;flex-direction:row;gap:5px;overflow-x:auto;border:0;border-bottom:1px solid var(--line);padding:10px}.nav-label,.nav-help{display:none}.nav button{flex:0 0 auto;width:auto;white-space:nowrap;padding:9px 12px}.nav button .sym{display:none}.main{padding:21px 15px}.page-title{font-size:22px}.page-top{align-items:start}.stage{white-space:normal;font-size:10px}.kpis{gap:8px}.kpi{padding:12px;min-height:108px}.kpi strong{font-size:24px}.cols,.two{grid-template-columns:1fr}}

/* Identidade visual oficial Meu Artigo · azul #0B57D0 / #2563EB. */
.header{min-height:82px;padding:12px 30px}
.wordmark{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:770;letter-spacing:-.04em;color:var(--ink)}
.wordmark .brand-logo{display:block;width:48px;height:48px;flex:0 0 48px;object-fit:contain}
.wordmark .brand-name{white-space:nowrap}
.wordmark .brand-name strong{color:var(--blue);font-weight:800}
.mock-badge{background:#eaf2ff;color:#0b57d0;border:1px solid #e0ebff;font-size:11px;letter-spacing:.015em}
.stage{background:#eaf2ff;color:#0b57d0;border:1px solid #e5efff;font-weight:650}
.shell{box-shadow:0 16px 48px #12345d12;border-color:#dbe6f5}
.nav{background:#fbfcff;border-right-color:#dfe8f6;padding-top:31px}
.nav button{transition:background .15s,color .15s;font-size:12.5px}
.nav button.active{background:#e9f2ff;color:#0b57d0}
.nav button:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #76a9fa;outline-offset:2px}
.page-title{color:#101d43;font-size:27px;line-height:1.2}
.kpi{border-color:#dce7f6;box-shadow:0 2px 12px #173d7010;background:#fff}
.kpi strong{color:#101d43}
.kpi-heading{display:flex;gap:10px;align-items:center}
.kpi-icon{display:inline-grid;place-items:center;width:36px;height:36px;background:#eaf2ff;color:#0b57d0;border-radius:9px;flex-shrink:0;font-size:17px;font-weight:750}
.pane.tinted{background:linear-gradient(120deg,#f2f8ff,#f8fbff);border-color:#cce0fd}
.pane.tinted .mini-label{color:#0b57d0}
.primary{background:#0B57D0;box-shadow:0 2px 4px #0b57d018}
.primary:hover{background:#0845ab}
.secondary{color:#0b57d0}
.secondary:hover{background:#eaf2ff}
.gate-dot.done{background:#0B57D0;border-color:#0B57D0}
.gate-dot.now{color:#0B57D0;border-color:#2563EB;background:#f0f6ff}
.option.selected{border-color:#2563EB;background:linear-gradient(180deg,#edf4ff 0%,#f8fbff 100%)}
.pill.green{background:#eaf2ff;color:#0b57d0}
@media(max-width:650px){.header{padding:10px 13px;min-height:68px}.wordmark{font-size:18px;gap:8px}.wordmark .brand-logo{width:37px;height:37px;flex-basis:37px}.mock-badge{font-size:9px;padding:6px 8px}}
/* Research choices: readable selected state, never green-on-blue text. */
.option.selected{background:#ecf4ff;border:2px solid #0B57D0;color:#102047;box-shadow:0 3px 12px rgba(11,87,208,.12)}
.option.selected h3{color:#073b91;font-weight:800}
.option.selected p{color:#334f78;font-weight:450}
.option.selected .pill.green{color:#fff;background:#0B57D0}
.option:focus-visible{outline:3px solid #93baff;outline-offset:2px}
/* E05: stable iframe dimensions while switching screens. Scrolling stays in
   the main panel instead of resizing the ChatGPT host around hovered menus. */
.layout{height:740px;min-height:740px}
.nav{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.main{height:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain}
@media(max-width:650px){
 .layout{display:flex;flex-direction:column}
 .nav{flex:0 0 auto;overflow-x:auto;overflow-y:hidden}
 .main{flex:1 1 auto;min-height:0;overflow-y:auto}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
#site-language{background:#fff;color:#102047;border:1px solid #dbe6f5;border-radius:9px;padding:8px;max-width:134px;font-size:12px}.site-language-label{font-size:12px;color:#667a96}@media(max-width:650px){.site-language-label{display:none}#site-language{max-width:100px;font-size:11px}}
/* Accessible supporting text and visible keyboard navigation at small sizes. */
.pane p,.line-item p{color:#425873}.footnote,.source-line,.kpi small{color:#526780}
.subtitle,.section-heading p{color:#4c6079}
@media(max-width:650px){.skip-link{font-size:14px}.option{min-height:88px}}
</style>

function localized(raw){
  const lex=TRANSLATIONS[activeLocale]||{};
  let result=String(raw);
  if(activeLocale==="pt")return result;
  const sorted=Object.keys(lex).sort((a,b)=>b.length-a.length);
  for(const word of sorted){if(result.includes(word))result=result.split(word).join(lex[word]);}
  return result;
}
function translateContainer(root){
 if(!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const candidates=[];
 while(walker.nextNode()){
   const node=walker.currentNode,element=node.parentElement;
   if(!element||element.closest("script,style,svg,textarea,input,[data-research-original]"))continue;
   if(isCanonical&&element.closest("td,.page-title,.pane h2,.pane .quiet"))continue;
   candidates.push(node);
 }
 for(const node of candidates){
   if(!sourceText.has(node))sourceText.set(node,node.nodeValue);
   node.nodeValue=localized(sourceText.get(node));
 }
 if(root.querySelectorAll){for(const element of root.querySelectorAll("input[placeholder]")){
   if(!element.dataset.originalPlaceholder)element.dataset.originalPlaceholder=element.placeholder;
   element.placeholder=localized(element.dataset.originalPlaceholder);
 }}
}

   const rows=matches.map(row=>'<tr>'+row.map(cell=>'<td data-research-original="true">'+cell+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="4">Nenhuma tarefa encontrada</td></tr>';
   return heading('Tarefas C.A.D.A.','Registros locais; execução e prazos não foram verificados por este painel.',input)+
    '<p class="footnote" role="status" aria-live="polite">'+matches.length+' tarefa(s) apresentada(s)</p>'+
    '<div class="pane table-scroll" style="padding:0"><table><caption class="sr-only">Tarefas registradas no projeto local</caption><thead><tr><th scope="col">ID Tarefa</th><th scope="col">Tarefa</th><th scope="col">Responsável execução</th><th scope="col">Prazo</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+safeNotice+realFooter;
  };
  screens.methods=()=>{
    const options=[['doc','Estudo documental qualitativo',
      'Compreender práticas e registros sem generalizar a rotinas não observadas.'],
      ['dsr','Design Science Research','Construir e avaliar um artefato não prova eficácia no uso cotidiano.'],
      ['mix','Métodos mistos','Integrar resultados qualitativos e quantitativos com justificativa explícita.'],
      ['other','Outro caminho','Permitir tradições não previstas no catálogo.']];
    const chosen=options.find(x=>x[0]===methodChoice);
    const cards=options.map(([id,name,desc])=>
      '<button type="button" data-method="'+id+'" class="option '+(methodChoice===id?'selected':'')+
      '" aria-pressed="'+(methodChoice===id?'true':'false')+'" style="text-align:left"><h3>'+name+
      '</h3><p>'+desc+'</p></button>').join('');
    return heading('Explorar caminhos metodológicos',
      'Catálogo de possibilidades; não é um método registrado do projeto.')+
      '<div class="info">Estas alternativas não registram métodos nem aprovam gates. A decisão deve ser tomada, justificada e registrada pelo pesquisador.</div>'+
      '<div class="two" style="margin-top:16px">'+cards+'</div>'+
      '<div class="pane" style="margin-top:16px"><div class="mini-label">Alternativa selecionada apenas para leitura</div>'+
      '<p>'+(chosen?chosen[1]+' — '+chosen[2]:'Nenhuma alternativa selecionada para leitura')+
      '</p><p>Consulte os registros autorizados para verificar o desenho escolhido.</p></div>'+safeNotice+realFooter;
  };
  screens.overview=()=>'<div class="page-top"><div><div class="eyebrow">Panorama da pesquisa</div>'+
    '<h1 class="page-title">Projeto autorizado · visão local</h1><p class="subtitle">'+e(siteData.active_route||'Rota não informada')+
    ' · estado científico a conferir</p></div><div class="stage">Snapshot local · não sincronizado</div></div>'+
    '<div class="kpis">'+
      kpi('Tarefas registradas',String(logged),'Quantidade registrada; execução não comprovada','▤')+
      kpi('Gates visíveis documentados',documentedCount,'Contagem somente dos registros exibidos; não equivale à validação independente','✓')+
      kpi('Pendências','Não avaliado','Depende de conferência do CONTINUIDADE.md','◷')+
      kpi('Fontes verificadas','Não avaliado','Nenhuma auditoria de fontes executada nesta tela','▱')+
    '</div>'+gateScope()+'<div class="cols"><section class="pane tinted"><div class="mini-label">Próxima ação registrada</div>'+
    '<h2 data-research-original="true">'+nextCode+'</h2><p data-research-original="true">'+nextText+'</p><p class="quiet">Responsável: <span data-research-original="true">'+nextOwner+'</span></p>'+
    '<button class="primary" data-go="tasks">Conferir tarefas →</button></section>'+
    '<section class="pane"><h3>Estado científico</h3><p>'+observedGates+' registro(s) de aprovação identificados em '+gates.length+
    ' gate(s) exibidos; a identidade do revisor não foi autenticada.</p>'+
    '<div class="gates">'+Array.from({length:7},(_,i)=>'<span class="gate-dot'+(gates[i]?.approval_documented===true?' done':'')+'">'+
    (gates[i]?.approval_documented===true?'✓':String(i+1))+'</span>').join('<span class="g-line"></span>')+
    '</div><div class="footnote">Validações científicas não são calculadas a partir de tarefas.</div></section></div>'+
    safeNotice+realFooter;
  screens.steps=()=>heading('Etapas e gates científicos','Estados registrados, não autenticação de avaliadores ou aprovação científica.')+
    gateScope()+(gateList?'<div class="list">'+gateList+'</div>':'<div class="info">Nenhum registro de gate disponível neste snapshot.</div>')+safeNotice+realFooter;
  screens.validations=()=>heading('Validações humanas','Os estados abaixo são declarativos; a decisão deve ser conferida nos registros originais.')+
    gateScope()+(gateList?'<div class="list">'+gateList+'</div>':'<div class="info">Sem estados de validação disponíveis.</div>')+technicalEvidence()+safeNotice+realFooter;
  screens.sources=()=>heading('Fontes e buscas','Somente informações auditadas podem justificar conclusões bibliográficas.')+noVerifiedAudit+safeNotice+realFooter;
  screens.evidence=()=>heading('Evidências e sustentação','Verificações documentais e indícios consultivos não autentificam a sustentação semântica.')+technicalEvidence()+safeNotice+realFooter;
  screens.trace=()=>heading('Rastreabilidade','DEC, TRACE e SNAP exigem conferência nos registros originais.')+
    '<div class="info">Histórico não inspecionado por esta visualização. Não são apresentados eventos ou aprovações presumidos.</div>'+safeNotice+realFooter;
  screens.submission=()=>heading('Preparação para submissão','Verifique perfil editorial, anonimização e aprovação dos gates.')+
    '<div class="info">Submissão não verificada. Não há confirmação de periódico, envio ou aceite nesta tela.</div>'+safeNotice+realFooter;
  screens.sync=()=>heading('Armazenamento e sincronização','Um arquivo local não comprova gravação remota.')+
    '<div class="info amber"><strong>Google Drive: não verificado nesta sessão.</strong> Este painel é somente uma projeção local de leitura.</div>'+safeNotice+realFooter;
}
}

function validCanonical(data){
 if(!data||data.schema!=='MEU_ARTIGO_SITE_V1'||data.kind!=='CANONICAL_LOCAL_SNAPSHOT'||
   data.canonical_drive_sync_verified!==false||data.automatic_scientific_approval!==false||
   data.canonical_writes_allowed!==false||!Array.isArray(data.tasks)||data.tasks.length>10000||
   !Array.isArray(data.gates)||data.gates.length>7||
   !data.next_action||typeof data.next_action!=='object'||Array.isArray(data.next_action))return false;
 const scalar=(value,max=2000)=>value===null||value===undefined||(typeof value==='string'&&value.length<=max);
 if(data.gate_view_partial!==undefined&&typeof data.gate_view_partial!=='boolean')return false;
 if(data.registered_gate_total!==undefined&&data.registered_gate_total!==null&&
   (!Number.isInteger(data.registered_gate_total)||data.registered_gate_total<0||
    data.registered_gate_total>7||data.registered_gate_total<data.gates.length))return false;
 if(data.gate_view_partial===false&&Number.isInteger(data.registered_gate_total)&&
    data.registered_gate_total>data.gates.length)return false;
 if(!scalar(data.active_route,120)||!(data.documented_gate_count===null||
    (Number.isInteger(data.documented_gate_count)&&data.documented_gate_count>=0&&data.documented_gate_count<=7)))return false;
 if(!data.tasks.every(t=>t&&typeof t==='object'&&!Array.isArray(t)&&scalar(t.id,120)&&
   scalar(t.task)&&scalar(t.execution_owner,300)&&scalar(t.deadline,120)))return false;
 if(!data.gates.every(g=>g&&typeof g==='object'&&!Array.isArray(g)&&scalar(g.id,120)&&
   typeof g.approval_documented==='boolean'))return false;
 if(data.scientific_diagnostic!=null){
   const d=data.scientific_diagnostic;
   if(!d||typeof d!=='object'||Array.isArray(d)||d.schema!=='MEU_ARTIGO_SCIENTIFIC_ADVISORY_PANEL_V1'||
      !['RECORDED_UNASSESSED','INPUTS_UNAVAILABLE'].includes(d.status)||
      d.human_review_required!==true||d.semantic_support_proven!==false||
      d.scientific_quality_validated!==false||d.scientific_gate_approved!==false||
      d.reports_written!==false||d.drive_sync_verified!==false||
      !Array.isArray(d.priority_codes)||d.priority_codes.length>6||
      !d.priority_codes.every(c=>typeof c==='string'&&/^[A-Z][A-Z0-9_]{0,63}$/.test(c)))return false;
   for(const key of ['objective_blockers','review_occurrences','advisory_occurrences','strict_required_occurrences']){
     const n=d[key];
     if(n!==null&&(!Number.isSafeInteger(n)||n<0||n>1000000))return false;
     if(d.status==='INPUTS_UNAVAILABLE'&&n!==null)return false;
   }
   if(d.verdict!==null&&!['CORRECAO_REQUERIDA','REVISAO_CIENTIFICA_PENDENTE'].includes(d.verdict))return false;
 }
 return ['code','explanation','responsible'].every(k=>scalar(data.next_action[k]));
}
function disconnectHost(){
 siteData={schema:'MEU_ARTIGO_SITE_V1',kind:'HOST_NOT_CONNECTED',locale:activeLocale};
 isCanonical=false;taskRows=[];taskQuery='';methodChoice='doc';
 const badge=document.querySelector('.mock-badge');
 if(badge)badge.textContent='AGUARDANDO DADOS';
 applyCanonical();current='overview';nav();render();applyLanguage(activeLocale);
}
function receiveHostData(nextData){
 if(!validCanonical(nextData)){disconnectHost();return false;}
 siteData=nextData;isCanonical=true;methodChoice='';
 // Set the next active language BEFORE building any dynamic locale content.
 // Translating static text after rendering alone cannot localize counts.
 if(nextData.locale&&nextData.locale!=='auto'){
   const requested=bcp(nextData.locale);
   activeLocale=['pt','en','es','fr'].includes(requested)?requested:'en';
 }
 taskRows=nextData.tasks.map(t=>[e(t.id),e(t.task),e(t.execution_owner),e(t.deadline)]);
 applyCanonical();
 const badge=document.querySelector('.mock-badge');
 if(badge)badge.textContent='SNAPSHOT LOCAL · SEM SINCRONIZAÇÃO';
 current='overview';nav();render();
 applyLanguage(nextData.locale&&nextData.locale!=='auto'?nextData.locale:activeLocale);
 return true;
}
window.MeuArtigoHost=Object.freeze({receive:receiveHostData,locale:applyLanguage,disconnect:disconnectHost});

function render(){ $('content').innerHTML=screens[current]();$('content').querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));$('content').querySelectorAll('[data-method]').forEach(b=>b.addEventListener('click',()=>{methodChoice=b.dataset.method;render()}));const filter=$('task-filter');if(filter){filter.value=taskQuery;filter.addEventListener('input',()=>{taskQuery=filter.value;const cursor=filter.selectionStart;render();const fresh=$('task-filter');fresh.focus();fresh.setSelectionRange(cursor,cursor)})}translateContainer($('content'))}
$('reset').addEventListener('click',()=>{taskQuery='';methodChoice='doc';go('overview')});
document.getElementById('site-language').addEventListener('change',e=>{
 applyLanguage(e.target.value);
 render();
});
nav();render();applyLanguage(activeLocale);
})();
</script>
