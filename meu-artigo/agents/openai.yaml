interface:
  display_name: "Meu Artigo"
  short_description: "Do problema ao artigo com gestão C.A.D.A."
  default_prompt: "Use $meu-artigo para organizar meu projeto, aplicar a gestão C.A.D.A. pela matriz como padrão, manter a rastreabilidade do processo científico, conectar as ferramentas de pesquisa e, quando houver um marco importante, permitir exportar um pacote auditável W3C PROV/RO-Crate com SHA-256. Se eu já usar um gerenciador, espelhe opcionalmente o passo a passo em ClickUp, Jira ou Trello."

dependencies:
  tools:
    - type: "mcp"
      value: "google-drive"
      description: "Persist research folders, PDFs, Docs, Sheets, search logs, evidence matrices, and continuity state."
    - type: "mcp"
      value: "consensus"
      description: "Search and synthesize peer-reviewed literature for terminology calibration, novelty auditing, and evidence discovery."
    - type: "mcp"
      value: "scite"
      description: "Inspect citation context, citation graphs, and verified literature/full text where available."
    - type: "mcp"
      value: "firecrawl"
      description: "Retrieve academic web, publisher, repository, journal, and official-source content."
